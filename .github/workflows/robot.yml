# GitHub Actions: "ultimate-board" deposunda .github/workflows/robot.yml olarak durur.
# Robot saatte bir robot.mjs çalıştırır; liste dosyaları ve şifreli durum "gh-pages" dalına TEK kayıt olarak zorla yazılır
# (geçmiş birikmez → depo büyümez). GitHub Pages bu dalı telefonlara sunar. Açık (public) depoda Actions ücretsizdir.
# Gizliler (Settings → Secrets → Actions): SA_JSON (hizmet hesabı JSON'u), STATE_KEY (uzun rastgele şifre).
#
# ZAMANLAMA (10 Kasım 2026): GitHub'ın "schedule" tetikleyicisi bu depoda hiç çalışmadı (19:17–21:17 UTC, yeniden kayıt da
# işe yaramadı). Bu yüzden robot KENDİNİ ZİNCİRLER: bir çalışma ~5 saat boyunca 10 dakikada bir listeleri yeniler, sonunda kendini
# yeniden başlatır (workflow_dispatch). "concurrency" aynı anda yalnızca bir robotun çalışmasını sağlar; schedule ileride
# çalışmaya başlarsa en fazla bir çalışma sırada bekler, zincir çoğalmaz. Zincir koparsa Actions → robot → Run workflow.
name: robot
on:
  schedule:
    - cron: '17 * * * *'        # yedek; GitHub çalıştırırsa zincire katılır
  workflow_dispatch: {}          # zincir + elle "Run workflow"
permissions:
  contents: write
  actions: write
concurrency:
  group: robot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 10 dakikada bir listeleri yenile (30 tur ≈ 5 saat)
        env:
          SA_JSON: ${{ secrets.SA_JSON }}
          STATE_KEY: ${{ secrets.STATE_KEY }}
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          tur() {
            rm -rf out && mkdir -p out
            git fetch --depth=1 origin gh-pages 2>/dev/null && git show origin/gh-pages:state.enc > out/state.enc || { rm -f out/state.enc; echo "ilk çalışma: durum yok"; }
            node robot.mjs --out out || return 1
            ( cd out && touch .nojekyll && rm -rf .git && git init -q -b gh-pages \
              && git config user.name "board-robot" && git config user.email "board-robot@users.noreply.github.com" \
              && git add -A && git commit -q -m "liste $(date -u +%F' '%H:%M)" && git push -q -f "$PUSH_URL" gh-pages )
          }
          # 10 Kasım (kullanıcı: "1 saat çok fazla"): 10 dakikada bir. Robot yalnızca değişen oyuncuları okur → okuma artmaz;
          # GitHub Pages saatte en çok 10 yayın → 6 yayın sınırın altında
          for i in $(seq 1 30); do
            echo "== tur $i · $(date -u +%H:%M) UTC"
            tur || echo "::warning::tur $i başarısız, bir sonraki turda yeniden denenecek"
            if [ "$i" -lt 30 ]; then sleep 540; fi
          done
      - name: Zinciri sürdür (kendini yeniden başlat)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        # GitHub anlık arıza verirse (ör. "Internal server error") 30 sn arayla 6 kez dener → zincir kopmasın
        run: |
          for i in 1 2 3 4 5 6; do
            gh workflow run robot.yml -R "${{ github.repository }}" --ref "${{ github.ref_name }}" && { echo "zincir sürüyor (deneme $i)"; exit 0; }
            echo "::warning::yeniden başlatma denemesi $i başarısız, 30 sn sonra tekrar"; sleep 30
          done
          echo "::error::zincir yeniden başlatılamadı — Actions → robot → Run workflow"; exit 1
